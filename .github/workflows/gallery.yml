name: Galerie spiegeln

# Holt alle 30 Minuten die freigegebenen Contest-Skins vom Discord-Bot
# und legt sie im Branch "gallery" ab (die App liest sie von dort).
# Einmalig nötig: Settings → Secrets and variables → Actions → New repository secret
#   Name: HUB_URL   Wert: Adresse des Command-Hub-Servers
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gallery
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - name: Alte Galerie holen
        run: |
          git clone --quiet --depth 1 --branch gallery "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/old || mkdir -p /tmp/old
      - name: Galerie laden
        env:
          HUB_URL: ${{ secrets.HUB_URL }}
        run: python3 .github/scripts/gallery.py /tmp/old /tmp/new
      - name: Veröffentlichen
        run: |
          [ -f /tmp/new/index.json ] || exit 0
          if [ -f /tmp/old/index.json ] && cmp -s /tmp/old/index.json /tmp/new/index.json; then echo "Keine Änderung"; exit 0; fi
          cd /tmp/new
          git init --quiet -b gallery
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "Galerie aktualisiert"
          git push --quiet --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gallery
